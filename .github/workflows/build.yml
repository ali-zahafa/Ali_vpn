name: Build EgyVPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -q -o egy_vpn_complete.zip
          cp -rf egy_vpn/* .
          rm -rf egy_vpn egy_vpn_complete.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Fill missing Android binary files (Wrapper & Icons)
        run: |
          flutter create --org com.egy.vpn /tmp/template_app
          mkdir -p android/gradle/wrapper
          cp -n /tmp/template_app/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/ || true
          cp -n /tmp/template_app/android/gradlew android/ || true
          cp -rn /tmp/template_app/android/app/src/main/res/mipmap-* android/app/src/main/res/ || true
          chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyVPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
