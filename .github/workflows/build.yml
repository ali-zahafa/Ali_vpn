name: Build EgyVPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -q -o egy_vpn_complete.zip
          cp -rf egy_vpn/* .
          rm -rf egy_vpn egy_vpn_complete.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Fill missing Android binary files
        run: |
          flutter create --org com.egy.vpn /tmp/template_app
          mkdir -p android/gradle/wrapper
          cp -n /tmp/template_app/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/ || true
          cp -n /tmp/template_app/android/gradlew android/ || true
          cp -rn /tmp/template_app/android/app/src/main/res/mipmap-* android/app/src/main/res/ || true
          chmod +x android/gradlew
          echo "" >> android/gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Patch NDK 27, Fix Zombie Detector & OpenVPN Classpath
        run: |
          python3 - << 'PYEOF'
          import glob, os, re, shutil, zipfile

          pub_cache = os.path.expanduser("~/.pub-cache")
          libs_dir = "android/app/libs"
          os.makedirs(libs_dir, exist_ok=True)

          # 1. Fix OpenVPN classes
          idx = 0
          for root, _, files in os.walk(pub_cache):
              if "openvpn_flutter" not in root:
                  continue
              for f in files:
                  full = os.path.join(root, f)
                  if f.endswith(".aar"):
                      with zipfile.ZipFile(full, 'r') as z:
                          for member in z.namelist():
                              if member.endswith(".jar"):
                                  idx += 1
                                  out_jar = os.path.join(libs_dir, f"ovpn_dep_{idx}.jar")
                                  with z.open(member) as src, open(out_jar, "wb") as dst:
                                      shutil.copyfileobj(src, dst)
                  elif f.endswith(".jar") and "gradle" not in f:
                      idx += 1
                      out_jar = os.path.join(libs_dir, f"ovpn_jar_{idx}.jar")
                      shutil.copy2(full, out_jar)

          for bg in glob.glob(f"{pub_cache}/hosted/pub.dev/openvpn_flutter-*/android/build.gradle"):
              with open(bg, "r", encoding="utf-8") as f:
                  txt = f.read()
              txt = re.sub(r'\bimplementation(\s+project\b|\s+[\'"][^\'"]+[\'"])', r'api\1', txt)
              with open(bg, "w", encoding="utf-8") as f:
                  f.write(txt)

          # 2. Patch MainActivity.kt with Reflection
          main_kt = "android/app/src/main/kotlin/com/egy/vpn/MainActivity.kt"
          if os.path.exists(main_kt):
              with open(main_kt, "r", encoding="utf-8") as f:
                  code = f.read()
              if "OpenVPNFlutterPlugin" in code:
                  code = re.sub(r'^\s*import\s+id\.laskarmedia\.openvpn_flutter\.OpenVPNFlutterPlugin\s*$', '', code, flags=re.M)
                  code = code.replace("id.laskarmedia.openvpn_flutter.OpenVPNFlutterPlugin", "OpenVPNFlutterPlugin")
                  shim = """
          private object OpenVPNFlutterPlugin {
              fun connectWhileGranted(granted: Boolean) {
                  try {
                      Class.forName("id.laskarmedia.openvpn_flutter.OpenVPNFlutterPlugin")
                          .getMethod("connectWhileGranted", Boolean::class.javaPrimitiveType)
                          .invoke(null, granted)
                  } catch (_: Throwable) {}
              }
          }
          """
                  code = code + "\n" + shim
                  with open(main_kt, "w", encoding="utf-8") as f:
                      f.write(code)

          # 3. Patch android/app/build.gradle for NDK 27
          app_bg = "android/app/build.gradle"
          if os.path.exists(app_bg):
              with open(app_bg, "r", encoding="utf-8") as f:
                  abg = f.read()
              if "ndkVersion" in abg:
                  abg = re.sub(r'ndkVersion\s+.*', 'ndkVersion "27.0.12077973"', abg)
              else:
                  abg = abg.replace("android {", 'android {\n    ndkVersion "27.0.12077973"', 1)
              abg = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', abg)
              abg = re.sub(r'shrinkResources\s+true', 'shrinkResources false', abg)
              if "dependencies {" in abg:
                  abg = abg.replace("dependencies {", 'dependencies {\n    compileOnly fileTree(dir: "libs", include: ["*.jar"])', 1)
              else:
                  abg += '\ndependencies {\n    compileOnly fileTree(dir: "libs", include: ["*.jar"])\n}\n'
              with open(app_bg, "w", encoding="utf-8") as f:
                  f.write(abg)

          # 4. FIX ZOMBIE DETECTOR in vpn_controller.dart (Use Cloudflare/Google instead of ip-api)
          vpn_ctrl = "lib/controllers/vpn_controller.dart"
          if os.path.exists(vpn_ctrl):
              with open(vpn_ctrl, "r", encoding="utf-8") as f:
                  ctrl_code = f.read()
              # Replace ip-api check URL with cloudflare/google
              ctrl_code = ctrl_code.replace("http://ip-api.com/json", "https://1.1.1.1/cdn-cgi/trace")
              ctrl_code = ctrl_code.replace("https://ip-api.com/json", "https://1.1.1.1/cdn-cgi/trace")
              # Relax timeout to 8 seconds
              ctrl_code = re.sub(r'Duration\(seconds:\s*\d+\)', 'Duration(seconds: 8)', ctrl_code)
              with open(vpn_ctrl, "w", encoding="utf-8") as f:
                  f.write(ctrl_code)
              print("Patched vpn_controller.dart with reliable Cloudflare trace endpoint")
          PYEOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyVPN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
